schema_version: induction_challenge100_round1_public_registry_v1
release_tag: induction-challenge100-round1-v1.0
selection_policy:
  direct_source: direct Round-1 LLM output only
  residual_policy: first parser-evaluable response in declared effort priority
  forbidden_selection_signals:
  - train correctness
  - holdout correctness
  - symbolic repair or simplification
  multi_formula_policy: a response is evaluable if any submitted formula parses and
    correct if any submitted formula is train-valid
